repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: .venv/bin/ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: .venv/bin/ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: .venv/bin/python scripts/check_types.py
        language: system
        pass_filenames: false
        types: [python]
